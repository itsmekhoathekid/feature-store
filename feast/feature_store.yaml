project: feature_store_demo
provider: local
registry: /data/registry.db
offline_store:
  type: file
online_store:
  type: redis
  connection_string: redis:6379
batch_engine:
  type: spark.engine
  spark_conf:
    spark.master: local[*]
    spark.app.name: FeastStreamFeatureViewDemo
    spark.ui.enabled: "false"
    spark.eventLog.enabled: "false"
    spark.sql.session.timeZone: UTC
    spark.sql.shuffle.partitions: "4"
feature_server:
  type: local
  offline_push_batching_enabled: true
  offline_push_batching_batch_size: 1
  offline_push_batching_batch_interval_seconds: 2
entity_key_serialization_version: 3
