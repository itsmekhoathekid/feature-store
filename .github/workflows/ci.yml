name: CI

on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: flink-job/pom.xml
      - run: mvn -q test
        working-directory: flink-job

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check python feast docker scripts
      - run: python -m pytest -q
      - run: python scripts/check_readme_references.py

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config --quiet
      - run: docker compose build feast
      - run: docker compose up -d --wait kafka kafka-init redis
      - run: docker compose run --rm seed
      - if: always()
        run: docker compose down --remove-orphans
