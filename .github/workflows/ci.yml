name: CI

on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: flink-job/pom.xml
      - run: mvn -q test
        working-directory: flink-job

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check python feast docker scripts
      - run: python -m pytest -q
      - run: python scripts/check_readme_references.py

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build feast
      - run: docker compose up -d --wait kafka kafka-init redis
      - run: docker compose run --rm seed
      - if: always()
        run: docker compose down --remove-orphans
