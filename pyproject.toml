[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "feature-store-demo"
version = "0.1.0"
description = "Feast StreamFeatureView and Flink DataStream aggregation demo"
requires-python = ">=3.11,<3.13"
dependencies = [
  "confluent-kafka==2.11.1",
  "feast[redis,spark]==0.66.0",
  "pandas==2.3.2",
  "pyarrow==21.0.0",
  "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.13.1",
]

[tool.hatch.build.targets.wheel]
packages = ["python/feature_store_demo"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
